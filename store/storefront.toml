# `day store stage` writes what each store expects, and `day lint` checks the stores' limits.
# The bundle id is Day.toml's; the store records are the existing Net Skip ones.

[storefront.submission-info]
copyright = "2026 The App Fair Project"
contact-email = "support@appfair.org"
contact-first-name = "App"
contact-last-name = "Fair"
contact-phone = "3107337836"
review-notes = """
Net Skip is a web browser and needs no sign-in. Type an address or a search in the address bar
and press Go. Searches go to DuckDuckGo by default; Settings > Search lists the other engines. Tap the
tabs button to see open tabs and open new ones, and the book button for bookmarks and history.
"""

[storefront.ios-uikit.apple-app-store.submission-info]
apple-category = "UTILITIES"

[storefront.metadata]
name = "Net Skip"
subtitle = "A fast, private web browser"
short = "A web browser with tabs, bookmarks, history, and your choice of search engine."
description = """
Net Skip is a web browser for your phone, tablet and computer. It uses your device's own web engine, so pages load quickly and scroll smoothly, and the controls around the page stay small and out of your way.

Type a few letters in the address bar and Net Skip completes the site from your history. Suggestions from your bookmarks, history, open tabs and your search engine appear as you type.

• Ad and tracker blocking, Off, Light, Strong or Aggressive, set for every site or just one. The filter lists come from their publishers and update on their own.
• Tabs: a tab strip on a tablet or computer, and a grid of open tabs on a phone.
• Links open in a new tab beside the page they came from. Reopen Closed Tab brings back the last 25 you closed.
• Search with DuckDuckGo, Kagi, Google, Bing, Ecosia, Qwant, Startpage, and more, or any search engine you add by its address.
• Bookmarks appear as Favorites on the start page, beside the sites you visit most.
• History is grouped by day and searchable. Clear the last hour, today, or everything.
• Private tabs keep their pages out of your history and forget their cookies when you close them.
• Find in page, page zoom, and your tabs restored the next time you open the app.

Net Skip keeps your history and bookmarks on your device and contains no ads or tracking. Search suggestions, which send what you type in the address bar to your search engine, can be turned off in Settings.

Net Skip is open source under the Mozilla Public License 2.0: github.com/Net-Skip/Net-Skip
"""
keywords = ["browser", "web", "internet", "tabs", "private", "search", "kagi", "bookmarks", "history"]
release-notes = """
Net Skip 2.0 is rebuilt from the ground up. The address bar completes sites from your history as you type, tabs open beside the page that opened them, and DuckDuckGo is the default search engine, with 13 others to choose from or any engine you add. The app now runs on computers as well as phones and tablets.
"""
promo = "Type a few letters and Net Skip completes the site from your history."
marketing-url = "https://net-skip.github.io/Net-Skip/"
support-url = "https://github.com/Net-Skip/Net-Skip/issues"
privacy-url = "https://appfair.org/privacy/"

# The walkthrough captures (dayscript/walkthrough.yaml) each listing shows, in order.
[storefront.ios-uikit.screenshots]
default = ["page", "ads-blocked", "inline-completion", "tab-grid", "favorites", "history", "settings-search"]
# The iPad's tab overview draws its page snapshots part-way, so its capture stays out until that
# is fixed.
ipad = ["page", "ads-blocked", "inline-completion", "favorites", "history", "settings-search"]

[storefront.android-material.screenshots]
default = ["page", "ads-blocked", "inline-completion", "tab-grid", "favorites", "history", "settings-search"]
# The tablet's tab overview draws its page snapshots part-way, as the iPad's does.
tablet = ["page", "ads-blocked", "inline-completion", "favorites", "history", "settings-search"]
