[storefront.metadata]
name = "Net Skip"
subtitle = "तेज़ और निजी वेब ब्राउज़र"
short = "टैब, बुकमार्क, इतिहास और अपनी पसंद के खोज इंजन वाला वेब ब्राउज़र।"
description = """
Net Skip आपके फ़ोन, टैबलेट और कंप्यूटर के लिए एक वेब ब्राउज़र है। यह आपके डिवाइस का अपना वेब इंजन इस्तेमाल करता है, इसलिए पेज जल्दी लोड होते हैं और आसानी से स्क्रॉल होते हैं, और पेज के आसपास के कंट्रोल छोटे रहते हैं और रास्ते में नहीं आते।

एड्रेस बार में कुछ अक्षर टाइप करें, और Net Skip आपके इतिहास से साइट का पता पूरा कर देता है। टाइप करते समय आपके बुकमार्क, इतिहास, खुले टैब और खोज इंजन से सुझाव दिखते हैं।

• विज्ञापन और ट्रैकर ब्लॉकिंग: बंद, हल्का, सख़्त या आक्रामक, सभी साइटों के लिए या सिर्फ़ एक के लिए। फ़िल्टर सूचियाँ अपने प्रकाशकों से आती हैं और खुद अपडेट होती हैं।
• टैब: टैबलेट और कंप्यूटर पर टैब स्ट्रिप, और फ़ोन पर खुले टैब का ग्रिड।
• लिंक उसी पेज के पास नए टैब में खुलते हैं जहाँ से वे आए। "बंद टैब फिर से खोलें" आपके बंद किए गए आख़िरी 25 टैब वापस लाता है।
• Kagi, DuckDuckGo, Google, Bing, Ecosia, Qwant, Startpage और कई अन्य से खोजें, या कोई भी खोज इंजन उसका पता डालकर जोड़ें।
• बुकमार्क स्टार्ट पेज पर पसंदीदा के रूप में दिखते हैं, आपकी सबसे ज़्यादा देखी गई साइटों के साथ।
• इतिहास दिन के हिसाब से समूहों में है और उसमें खोजा जा सकता है। पिछला एक घंटा, आज का दिन या सब कुछ साफ़ करें।
• निजी टैब अपने पेजों को आपके इतिहास से बाहर रखते हैं और बंद करने पर अपनी कुकी भूल जाते हैं।
• पेज पर खोजें, पेज ज़ूम, और अगली बार ऐप खोलने पर आपके टैब वापस।

Net Skip आपका इतिहास और बुकमार्क आपके डिवाइस पर रखता है, और इसमें न विज्ञापन हैं, न ट्रैकिंग। खोज सुझाव, जो एड्रेस बार में आपका टाइप किया हुआ टेक्स्ट आपके खोज इंजन को भेजते हैं, सेटिंग्स में बंद किए जा सकते हैं।

Net Skip, Mozilla Public License 2.0 के तहत ओपन सोर्स है: github.com/Net-Skip/Net-Skip
"""
keywords = ["ब्राउज़र", "वेब", "इंटरनेट", "टैब", "निजी", "खोज", "kagi", "बुकमार्क", "इतिहास"]
release-notes = """
Net Skip 2.0 पूरी तरह नए सिरे से बनाया गया है। एड्रेस बार टाइप करते समय आपके इतिहास से साइटें पूरी करता है, टैब उसी पेज के पास खुलते हैं जिसने उन्हें खोला, और Kagi डिफ़ॉल्ट खोज इंजन है, साथ में चुनने के लिए 13 और इंजन या कोई भी इंजन जो आप जोड़ें। ऐप अब फ़ोन और टैबलेट के साथ कंप्यूटर पर भी चलता है।
"""
promo = "कुछ अक्षर टाइप करें, और Net Skip आपके इतिहास से साइट का पता पूरा कर देता है।"
