# file of its own so a translator edits one file per language. What it leaves out (the URLs) is
# the default locale's.
[storefront.metadata]
name = "Net Skip"
subtitle = "速くてプライベートなブラウザ"
short = "タブ、ブックマーク、履歴を備え、検索エンジンを自由に選べるウェブブラウザ。"
description = """
Net Skipは、スマートフォン、タブレット、コンピュータで使えるウェブブラウザです。デバイスに組み込まれたウェブエンジンを使うので、ページはすばやく読み込まれ、スクロールもなめらか。ページのまわりの操作ボタンは小さく控えめです。

アドレスバーに数文字入力すると、Net Skipが履歴からサイトのアドレスを補完します。入力中には、ブックマーク、履歴、開いているタブ、検索エンジンからの候補が表示されます。

• 広告とトラッカーのブロック：オフ・弱・強・最強から、すべてのサイトまたはサイトごとに選べます。フィルタリストは配布元から取得され、自動で更新されます。
• タブ：タブレットやコンピュータではタブバー、スマートフォンでは開いているタブのグリッド。
• リンクは、リンク元のページの隣に新しいタブで開きます。「閉じたタブを開き直す」で、最後に閉じた25個までのタブを戻せます。
• DuckDuckGo、Kagi、Google、Bing、Ecosia、Qwant、Startpageなどで検索できるほか、アドレスを指定して好きな検索エンジンを追加できます。
• ブックマークは、よく閲覧するサイトと並んで、スタートページのお気に入りに表示されます。
• 履歴は日ごとにまとめられ、検索できます。過去1時間、今日、またはすべての履歴を消去できます。
• プライベートタブで表示したページは履歴に残らず、タブを閉じるとCookieも消去されます。
• ページ内検索、ページのズーム、次回起動時のタブの復元に対応。

Net Skipは履歴とブックマークをデバイス内に保存し、広告もトラッキングもありません。アドレスバーに入力した内容を検索エンジンに送信する検索候補は、設定でオフにできます。

Net SkipはMozilla Public License 2.0のもとで公開されているオープンソースソフトウェアです：github.com/Net-Skip/Net-Skip
"""
keywords = ["ブラウザ", "ウェブ", "インターネット", "タブ", "プライベート", "検索", "kagi", "ブックマーク", "履歴"]
release-notes = """
Net Skip 2.0は一から作り直しました。アドレスバーは入力中に履歴からサイトを補完し、タブはそれを開いたページの隣に開きます。デフォルトの検索エンジンはDuckDuckGoで、ほかの13種類から選ぶことも、好きな検索エンジンを追加することもできます。スマートフォンとタブレットに加えて、コンピュータでも使えるようになりました。
"""
promo = "数文字入力するだけで、Net Skipが履歴からサイトのアドレスを補完します。"
