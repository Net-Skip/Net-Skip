#
# The Indonesian listing text: the same table as store/storefront.toml's [storefront.metadata], in
# a file of its own so a translator edits one file per language. What it leaves out (the URLs) is
# the default locale's.
[storefront.metadata]
name = "Net Skip"
subtitle = "Peramban web cepat dan privat"
short = "Peramban web dengan tab, bookmark, riwayat, dan mesin pencari pilihan Anda."
description = """
Net Skip adalah peramban web untuk ponsel, tablet, dan komputer Anda. Net Skip memakai mesin web bawaan perangkat Anda, sehingga halaman dimuat dengan cepat dan bergulir dengan mulus, sementara kontrol di sekitar halaman tetap kecil dan tidak menghalangi.

Ketik beberapa huruf di bilah alamat, dan Net Skip melengkapi situsnya dari riwayat Anda. Saran dari bookmark, riwayat, tab yang terbuka, dan mesin pencari Anda muncul selagi Anda mengetik.

• Pemblokir iklan dan pelacak: Mati, Ringan, Kuat, atau Agresif, untuk semua situs atau satu situs saja. Daftar filter berasal dari penerbitnya dan diperbarui sendiri.
• Tab: bilah tab di tablet atau komputer, dan kisi tab yang terbuka di ponsel.
• Tautan terbuka di tab baru di samping halaman asalnya. Buka Lagi Tab Tertutup mengembalikan 25 tab terakhir yang Anda tutup.
• Cari dengan Kagi, DuckDuckGo, Google, Bing, Ecosia, Qwant, Startpage, dan lainnya, atau dengan mesin pencari apa pun yang Anda tambahkan lewat alamatnya.
• Bookmark muncul sebagai Favorit di halaman awal, di samping situs yang paling sering Anda kunjungi.
• Riwayat dikelompokkan per hari dan bisa dicari. Hapus satu jam terakhir, hari ini, atau semuanya.
• Tab pribadi tidak menyimpan halamannya di riwayat dan melupakan cookie-nya saat Anda menutupnya.
• Cari di halaman, zoom halaman, dan tab Anda dipulihkan saat Anda membuka aplikasi berikutnya.

Net Skip menyimpan riwayat dan bookmark di perangkat Anda, tanpa iklan dan tanpa pelacakan. Saran pencarian, yang mengirim apa yang Anda ketik di bilah alamat ke mesin pencari Anda, dapat dimatikan di Pengaturan.

Net Skip adalah sumber terbuka di bawah Mozilla Public License 2.0: github.com/Net-Skip/Net-Skip
"""
keywords = ["peramban", "browser", "web", "internet", "tab", "privat", "pencarian", "kagi", "bookmark", "riwayat"]
release-notes = """
Net Skip 2.0 dibangun ulang dari awal. Bilah alamat melengkapi situs dari riwayat Anda selagi Anda mengetik, tab terbuka di samping halaman yang membukanya, dan Kagi menjadi mesin pencari bawaan, dengan 13 pilihan lain atau mesin apa pun yang Anda tambahkan. Aplikasi ini kini juga berjalan di komputer, selain di ponsel dan tablet.
"""
promo = "Ketik beberapa huruf dan Net Skip melengkapi situsnya dari riwayat Anda."
