[storefront.metadata]
name = "Net Skip"
subtitle = "Schneller, privater Webbrowser"
short = "Webbrowser mit Tabs, Lesezeichen, Verlauf und der Suchmaschine deiner Wahl."
description = """
Net Skip ist ein Webbrowser für dein Smartphone, dein Tablet und deinen Computer. Er nutzt die Web-Engine deines Geräts, damit Seiten schnell laden und flüssig scrollen, und die Bedienelemente rund um die Seite bleiben klein und unauffällig.

Tippe ein paar Buchstaben in die Adressleiste, und Net Skip ergänzt die Website aus deinem Verlauf. Schon beim Tippen erscheinen Vorschläge aus deinen Lesezeichen, deinem Verlauf, offenen Tabs und deiner Suchmaschine.

• Werbe- und Trackerblocker in den Stufen Aus, Leicht, Stark und Aggressiv, für alle Websites oder nur eine. Die Filterlisten kommen von ihren Herausgebern und aktualisieren sich selbst.
• Tabs: eine Tableiste auf Tablet und Computer, eine Übersicht der offenen Tabs auf dem Smartphone.
• Links öffnen sich in einem neuen Tab neben der Seite, von der sie kommen. „Geschlossenen Tab wieder öffnen“ holt die letzten 25 geschlossenen Tabs zurück.
• Suche mit DuckDuckGo, Kagi, Google, Bing, Ecosia, Qwant, Startpage und weiteren, oder mit jeder Suchmaschine, die du über ihre Adresse hinzufügst.
• Lesezeichen erscheinen als Favoriten auf der Startseite, neben den Websites, die du am häufigsten besuchst.
• Der Verlauf ist nach Tagen gruppiert und durchsuchbar. Lösche die letzte Stunde, den heutigen Tag oder alles.
• Private Tabs halten ihre Seiten aus deinem Verlauf heraus und vergessen ihre Cookies, sobald du sie schließt.
• Suche auf der Seite, Seitenzoom, und deine Tabs sind beim nächsten Öffnen der App wieder da.

Net Skip speichert Verlauf und Lesezeichen auf deinem Gerät und enthält keine Werbung und kein Tracking. Suchvorschläge, die deine Eingabe in der Adressleiste an deine Suchmaschine senden, lassen sich in den Einstellungen ausschalten.

Net Skip ist Open Source unter der Mozilla Public License 2.0: github.com/Net-Skip/Net-Skip
"""
keywords = ["Browser", "Webbrowser", "Internet", "Tabs", "privat", "Suche", "Kagi", "Lesezeichen", "Verlauf"]
release-notes = """
Net Skip 2.0 ist von Grund auf neu gebaut. Die Adressleiste ergänzt Websites beim Tippen aus deinem Verlauf, Tabs öffnen sich neben der Seite, die sie geöffnet hat, und DuckDuckGo ist die Standardsuchmaschine, mit 13 weiteren zur Auswahl oder jeder, die du selbst hinzufügst. Die App läuft jetzt auch auf Computern, nicht nur auf Smartphones und Tablets.
"""
promo = "Tippe ein paar Buchstaben, und Net Skip ergänzt die Website aus deinem Verlauf."
