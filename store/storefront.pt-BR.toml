#
# The Brazilian Portuguese listing text: the same table as store/storefront.toml's
# [storefront.metadata], in a file of its own so a translator edits one file per language. What it
# leaves out (the URLs) is the default locale's.
[storefront.metadata]
name = "Net Skip"
subtitle = "Navegador web rápido e privado"
short = "Um navegador web com abas, favoritos, histórico e o buscador que você preferir."
description = """
Net Skip é um navegador web para o seu celular, tablet e computador. Ele usa o próprio motor web do seu aparelho, então as páginas carregam rápido e rolam com suavidade, e os controles em volta da página ficam pequenos e fora do caminho.

Digite algumas letras na barra de endereços e o Net Skip completa o site a partir do seu histórico. Sugestões dos seus favoritos, do histórico, das abas abertas e do seu mecanismo de busca aparecem enquanto você digita.

• Bloqueio de anúncios e rastreadores: Desativado, Leve, Forte ou Agressivo, para todos os sites ou só um. As listas de filtros vêm de quem as publica e se atualizam sozinhas.
• Abas: uma barra de abas no tablet e no computador, e uma grade de abas abertas no celular.
• Os links abrem em uma nova aba ao lado da página de onde vieram. Reabrir aba fechada traz de volta as últimas 25 que você fechou.
• Pesquise com DuckDuckGo, Kagi, Google, Bing, Ecosia, Qwant, Startpage e outros, ou com qualquer mecanismo de busca que você adicionar pelo endereço.
• Os favoritos aparecem na página de início, ao lado dos sites que você mais visita.
• O histórico é agrupado por dia e pode ser pesquisado. Limpe a última hora, o dia de hoje ou tudo.
• As abas privadas deixam suas páginas fora do histórico e esquecem os cookies quando você as fecha.
• Buscar na página, zoom da página e suas abas restauradas na próxima vez que você abrir o app.

O Net Skip guarda seu histórico e seus favoritos no seu aparelho e não tem anúncios nem rastreamento. As sugestões de pesquisa, que enviam ao seu mecanismo de busca o que você digita na barra de endereços, podem ser desativadas em Ajustes.

O Net Skip é de código aberto, sob a Mozilla Public License 2.0: github.com/Net-Skip/Net-Skip
"""
keywords = ["navegador", "web", "internet", "abas", "privado", "pesquisa", "kagi", "favoritos", "histórico"]
release-notes = """
O Net Skip 2.0 foi refeito do zero. A barra de endereços completa os sites a partir do seu histórico enquanto você digita, as abas abrem ao lado da página que as abriu e o DuckDuckGo é o mecanismo de busca padrão, com outros 13 para escolher ou qualquer um que você adicionar. O app agora funciona também em computadores, além de celulares e tablets.
"""
promo = "Digite algumas letras e o Net Skip completa o site a partir do seu histórico."
