[storefront.metadata]
name = "Net Skip"
subtitle = "Быстрый и приватный браузер"
short = "Браузер с вкладками, закладками, историей и поисковой системой на ваш выбор."
description = """
Net Skip — браузер для телефона, планшета и компьютера. Он использует веб-движок самого устройства, поэтому страницы загружаются быстро и плавно прокручиваются, а элементы управления вокруг страницы остаются компактными и не мешают.

Введите несколько букв в адресную строку, и Net Skip дополнит адрес сайта из вашей истории. Пока вы печатаете, появляются подсказки из закладок, истории, открытых вкладок и вашей поисковой системы.

• Блокировка рекламы и трекеров: выключена, лёгкая, строгая или агрессивная — для всех сайтов или для одного. Списки фильтров приходят от их авторов и обновляются сами.
• Вкладки: панель вкладок на планшете и компьютере и сетка открытых вкладок на телефоне.
• Ссылки открываются в новой вкладке рядом со страницей, с которой вы перешли. «Открыть закрытую вкладку» возвращает последние 25 закрытых.
• Ищите через DuckDuckGo, Kagi, Google, Bing, Ecosia, Qwant, Startpage и другие системы или через любую поисковую систему, добавленную по её адресу.
• Закладки показываются в разделе «Избранное» на начальной странице, рядом с сайтами, которые вы посещаете чаще всего.
• История сгруппирована по дням, в ней есть поиск. Очистите последний час, сегодняшний день или всё сразу.
• Частные вкладки не сохраняют страницы в истории и забывают свои файлы cookie, когда вы их закрываете.
• Поиск на странице, масштаб страницы и восстановление вкладок при следующем запуске приложения.

Net Skip хранит историю и закладки на вашем устройстве, и в нём нет рекламы и отслеживания. Поисковые подсказки, которые отправляют поисковой системе то, что вы вводите в адресную строку, можно отключить в настройках.

Net Skip — программа с открытым исходным кодом под лицензией Mozilla Public License 2.0: github.com/Net-Skip/Net-Skip
"""
keywords = ["браузер", "веб", "интернет", "вкладки", "приватный", "поиск", "kagi", "закладки", "история"]
release-notes = """
Net Skip 2.0 полностью переписан. Адресная строка дополняет сайты из истории прямо во время ввода, вкладки открываются рядом со страницей, из которой их открыли, а поиск по умолчанию идёт через DuckDuckGo; можно выбрать одну из 13 других систем или добавить свою. Теперь приложение работает и на компьютерах, а не только на телефонах и планшетах.
"""
promo = "Введите несколько букв, и Net Skip дополнит адрес сайта из вашей истории."
