[storefront.metadata]
name = "Net Skip"
subtitle = "متصفح ويب سريع وخاص"
short = "متصفح ويب فيه علامات تبويب وإشارات مرجعية وسجل ومحرك البحث الذي تختاره."
description = """
‏Net Skip متصفح ويب لهاتفك وجهازك اللوحي وحاسوبك. يستخدم محرك الويب المدمج في جهازك، فتُحمَّل الصفحات بسرعة وتتمرر بسلاسة، وتبقى عناصر التحكم حول الصفحة صغيرة ولا تعترض طريقك.

اكتب بضعة أحرف في شريط العناوين، فيُكمل Net Skip عنوان الموقع من سجلك. وأثناء الكتابة تظهر اقتراحات من إشاراتك المرجعية وسجلك وعلامات التبويب المفتوحة ومحرك البحث الذي تستخدمه.

• حظر الإعلانات وأدوات التتبع بمستويات: إيقاف أو خفيف أو قوي أو شديد، لكل المواقع أو لموقع واحد. تأتي قوائم التصفية من ناشريها وتتحدّث تلقائيًا.
• علامات التبويب: شريط علامات تبويب على الجهاز اللوحي والحاسوب، وشبكة لعلامات التبويب المفتوحة على الهاتف.
• تُفتح الروابط في علامة تبويب جديدة بجوار الصفحة التي جاءت منها. ويعيد أمر «إعادة فتح علامة التبويب المغلقة» آخر 25 علامة تبويب أغلقتها.
• ابحث باستخدام Kagi وDuckDuckGo وGoogle وBing وEcosia وQwant وStartpage وغيرها، أو بأي محرك بحث تضيفه من خلال عنوانه.
• تظهر الإشارات المرجعية في «المفضلة» على صفحة البداية، بجوار المواقع التي تزورها أكثر من غيرها.
• السجل مجمّع حسب اليوم وقابل للبحث. امسح آخر ساعة أو اليوم أو كل شيء.
• علامات التبويب الخاصة تُبقي صفحاتها خارج سجلك وتنسى ملفات تعريف الارتباط عند إغلاقها.
• البحث في الصفحة، وتكبير الصفحة، واستعادة علامات التبويب في المرة التالية التي تفتح فيها التطبيق.

يحفظ Net Skip سجلك وإشاراتك المرجعية على جهازك، ولا إعلانات فيه ولا تتبّع. ويمكنك إيقاف اقتراحات البحث، التي ترسل ما تكتبه في شريط العناوين إلى محرك البحث، من الإعدادات.

‏Net Skip مفتوح المصدر بموجب رخصة Mozilla Public License 2.0:‏ github.com/Net-Skip/Net-Skip
"""
keywords = ["متصفح", "ويب", "إنترنت", "علامات تبويب", "خاص", "بحث", "kagi", "إشارات مرجعية", "سجل"]
release-notes = """
‏Net Skip 2.0 أعيد بناؤه بالكامل. يُكمل شريط العناوين المواقع من سجلك أثناء الكتابة، وتُفتح علامات التبويب بجوار الصفحة التي فتحتها، وKagi هو محرك البحث الافتراضي، مع 13 محركًا آخر للاختيار أو أي محرك تضيفه. ويعمل التطبيق الآن على أجهزة الكمبيوتر أيضًا، إلى جانب الهواتف والأجهزة اللوحية.
"""
promo = "اكتب بضعة أحرف، فيُكمل Net Skip عنوان الموقع من سجلك."
