<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fde">
<title>Example Domain</title>
<link rel="icon" type="image/png" href="https://example.com/favicon.png">
<style>
  body { font: 17px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; margin: 0; color: #1d1d1f; background: #f7f7fa; }
  header { background: linear-gradient(135deg, #2f6fde, #6a4fd8); color: white; padding: 48px 24px; }
  main { max-width: 720px; margin: 0 auto; padding: 24px; }
  a { color: #2f6fde; }
  .card { background: white; border-radius: 12px; padding: 16px 20px; margin: 16px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f5f5f7; } .card { background: #2c2c2e; } a { color: #6fa0ff; } }
</style>
</head>
<body>
<header><h1 id="page-title">Example Domain</h1><p>This domain is for use in illustrative examples.</p></header>
<main>
  <div class="card">
    <h2>Read on</h2>
    <ul>
      <li><a id="link-news" href="https://example.com/news/">Example News</a></li>
      <li><a id="link-about" href="/about.html">About this site</a></li>
      <li><a id="link-org" href="https://example.org/" target="_blank">Example Organization (opens in a new tab)</a></li>
    </ul>
  </div>
  <div class="card">
    <h2>Search</h2>
    <form action="https://example.com/search/" method="get">
      <input id="site-search" name="q" placeholder="Search this site"> <button>Go</button>
    </form>
  </div>
</main>
</body>
</html>
